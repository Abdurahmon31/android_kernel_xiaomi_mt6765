name: Build Lotus Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Tools and Linker
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          # Manually create the 'ld' shortcut that is missing
          sudo ln -sf /usr/bin/aarch64-linux-gnu-ld /usr/bin/ld

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make clean
          make lotus_defconfig
          make -j$(nproc --all)

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-Kernel-Binary
          path: arch/arm64/boot/Image.gz-dtb
