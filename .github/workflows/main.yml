name: Build Lotus Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Compilers
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          # Find where 'ld' is and make sure the system can see it as 'ld'
          # This bypasses the need for gcc-multilib
          sudo ln -sf /usr/bin/ld.bfd /usr/bin/ld
          
          # Start the build process
          make clean
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lotus_defconfig
          
          # Build with host tool overrides to prevent the 'collect2' error
          make -j$(nproc --all) \
               ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               HOSTCC=gcc \
               HOSTLD=ld

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-Kernel-Binary
          path: arch/arm64/boot/Image.gz-dtb
