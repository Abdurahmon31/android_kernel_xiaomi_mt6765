name: Build Lotus Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-multilib

      - name: Build Kernel
        run: |
          # Clean up any failed garbage
          make clean
          
          # Setup the blueprint
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lotus_defconfig
          
          # The Secret Sauce: We explicitly tell the build to use the standard 'ld' 
          # for host tools so fixdep doesn't crash.
          make -j$(nproc --all) \
               ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               HOSTCC=gcc \
               HOSTLD=ld

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-Kernel-Binary
          path: arch/arm64/boot/Image.gz-dtb
