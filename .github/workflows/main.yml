name: Build Lotus Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          # We define the cross-compiler but allow the local CC to handle helper tools
          make clean
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lotus_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc --all)

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-Kernel-Binary
          path: arch/arm64/boot/Image.gz-dtb
