name: Build Lotus Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Compilers
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          # Use the stable version of the tool paths for Ubuntu 20.04
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make clean
          make lotus_defconfig
          
          # We tell the build to use the standard system 'gcc' and 'ld' 
          # specifically for the host-side tools like fixdep.
          make -j$(nproc --all) \
               HOSTCC=gcc \
               HOSTLD=ld \
               CC=aarch64-linux-gnu-gcc \
               LD=aarch64-linux-gnu-ld

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Lotus-Kernel-Binary
          path: arch/arm64/boot/Image.gz-dtb
